<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STEM Vault - بوابة ملفات STEM</title>
  <!-- مكتبة EmailJS الرسمية -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <style>
    :root {
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --bg: #090d16;
      --card-bg: rgba(17, 24, 39, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f9fafb;
      --text-muted: #9ca3af;
      --accent: #10b981;
      --owner: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #090d16 80%);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
    }

    /* أنيميشن الخلفية والبطاقة */
    @keyframes floatCard {
      0% { transform: translateY(0px) scale(0.98); opacity: 0; }
      100% { transform: translateY(0px) scale(1); opacity: 1; }
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 10px 40px -10px rgba(59, 130, 246, 0.25); }
      50% { box-shadow: 0 15px 50px -5px rgba(59, 130, 246, 0.4); }
    }

    @keyframes fadeInSlide {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px;
      width: 100%;
      max-width: 520px;
      animation: floatCard 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards, pulseGlow 4s infinite ease-in-out;
      position: relative;
    }

    h2, h3 {
      font-weight: 800;
      margin-bottom: 8px;
      text-align: center;
      letter-spacing: -0.5px;
    }

    .brand-title {
      background: linear-gradient(135deg, #60a5fa, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: fadeInSlide 0.7s ease-out;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 14px;
      text-align: center;
      margin-bottom: 22px;
      animation: fadeInSlide 0.8s ease-out;
    }

    .auth-toggle {
      display: flex;
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 22px;
      overflow: hidden;
      background: rgba(3, 7, 18, 0.6);
      padding: 4px;
      gap: 4px;
    }

    .auth-toggle button {
      flex: 1;
      padding: 10px;
      margin-top: 0;
      background: transparent;
      color: var(--text-muted);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }

    .auth-toggle button.active {
      background: var(--primary);
      color: #fff;
      transform: scale(1.02);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: 500;
    }

    input, select, button {
      width: 100%;
      padding: 13px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 14px;
      outline: none;
    }

    input, select {
      background: rgba(3, 7, 18, 0.5);
      color: var(--text);
    }

    input:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
      transform: translateY(-2px);
    }

    button {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      border: none;
      margin-top: 18px;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
    }

    button:active {
      transform: translateY(1px) scale(0.98);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .hidden {
      display: none !important;
    }

    .filter-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-top: 20px;
    }

    .tab-btn {
      padding: 8px 16px;
      background: rgba(3, 7, 18, 0.6);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-muted);
      font-size: 12px;
      cursor: pointer;
      width: auto;
      margin: 0;
      white-space: nowrap;
    }

    .tab-btn:hover {
      background: rgba(255, 255, 255, 0.05);
      transform: translateY(-1px);
    }

    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      transform: translateY(-2px);
    }

    .file-item {
      background: rgba(3, 7, 18, 0.6);
      padding: 14px 18px;
      border-radius: 12px;
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-right: 4px solid var(--primary);
      border-left: 1px solid var(--border);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      animation: fadeInSlide 0.4s ease-out;
    }

    .file-item:hover {
      transform: translateX(-4px) translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
      border-right-color: #60a5fa;
    }

    .file-meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .badge {
      background: rgba(59, 130, 246, 0.15);
      color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.3);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
    }

    .owner-badge {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.4);
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      display: inline-block;
      margin-top: 5px;
      animation: fadeInSlide 0.5s ease-out;
    }

    .btn-action {
      background: transparent;
      border: none;
      width: auto;
      padding: 6px 12px;
      margin: 0;
      cursor: pointer;
      font-size: 12px;
      border-radius: 8px;
      font-weight: 600;
      box-shadow: none;
    }

    .btn-view {
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.2);
    }
    .btn-view:hover {
      background: rgba(56, 189, 248, 0.2);
      transform: scale(1.05);
    }

    .btn-delete {
      color: #f87171;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
    }
    .btn-delete:hover {
      background: rgba(239, 68, 68, 0.2);
      transform: scale(1.05);
    }

    .owner-panel {
      background: linear-gradient(135deg, rgba(30, 27, 75, 0.8), rgba(49, 46, 129, 0.5));
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 18px;
      border-radius: 14px;
      margin-top: 20px;
      animation: fadeInSlide 0.5s ease-out;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 12px;
    }

    .stat-card {
      background: rgba(15, 23, 42, 0.7);
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      border: 1px solid var(--border);
    }

    .stat-card h4 {
      font-size: 22px;
      color: #fbbf24;
      margin-bottom: 2px;
    }

    .stat-card span {
      font-size: 11px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <!-- واجهة 1: تسجيل دخول / إنشاء حساب بكلمة المرور -->
  <div id="step-auth" class="card">
    <h2 class="brand-title">STEM Vault</h2>
    <p class="subtitle" id="authSubtitle">تسجيل دخول أو إنشاء حساب بكلمة مرور ورمز التحقق</p>

    <div class="auth-toggle">
      <button id="tabRegister" class="active" onclick="switchAuthTab('register')">إنشاء حساب جديد</button>
      <button id="tabLogin" onclick="switchAuthTab('login')">تسجيل دخول</button>
    </div>

    <form onsubmit="handleAuthSubmit(event)">
      <label>البريد الإلكتروني:</label>
      <input type="email" id="userEmail" placeholder="student@example.com" required>

      <label>كلمة المرور:</label>
      <input type="password" id="userPassword" placeholder="••••••••" required minlength="6">

      <button id="authBtn" type="submit">متابعة واستلام كود التأكيد ✉️</button>
    </form>
  </div>

  <!-- واجهة 2: التحقق من كود الـ OTP -->
  <div id="step-otp" class="card hidden">
    <h2 class="brand-title">تأكيد الأمان</h2>
    <p class="subtitle" id="otpNotice">تم إرسال كود التحقق إلى بريدك</p>
    <label>أدخل كود الـ OTP المكون من 6 أرقام:</label>
    <input type="text" id="otpInput" maxlength="6" placeholder="000000" style="text-align: center; font-size: 28px; letter-spacing: 8px; font-weight: bold;">
    <button onclick="handleVerifyOTP()">تحقق والدخول للمنصة 🚀</button>
    <button style="background: transparent; color: var(--text-muted); margin-top: 10px; font-size: 13px; box-shadow: none;" onclick="backToAuth()">تعديل البيانات أو الإيميل</button>
  </div>

  <!-- واجهة 3: مستودع المواد وقسم الأونر -->
  <div id="step-dashboard" class="card hidden" style="max-width: 660px;">
    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
      <div>
        <h3 style="text-align: right; margin: 0;">مستودع ملفات STEM</h3>
        <p style="color: var(--text-muted); font-size: 13px; margin: 0;" id="userBadge"></p>
        <div id="ownerBadgeContainer"></div>
      </div>
      <button onclick="logout()" style="width: auto; margin: 0; padding: 8px 16px; font-size: 12px; background: #dc2626; box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);">خروج</button>
    </div>

    <!-- لوحة تحكم الأونر -->
    <div id="ownerSection" class="owner-panel hidden">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span style="color: #fbbf24; font-weight: bold; font-size: 14px;">👑 لوحة تحكم المالك (Owner Control)</span>
        <button onclick="clearAllFiles()" style="width: auto; margin: 0; padding: 6px 10px; font-size: 11px; background: #991b1b; box-shadow: none;">حذف كل الملفات</button>
      </div>
      <div class="stat-grid">
        <div class="stat-card">
          <h4 id="statTotalUsers">0</h4>
          <span>إجمالي الحسابات</span>
        </div>
        <div class="stat-card">
          <h4 id="statTotalFiles">0</h4>
          <span>إجمالي الملفات المشتركة</span>
        </div>
      </div>
    </div>

    <!-- رفع الملفات -->
    <div style="margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--border);">
      <label>المادة العلمية:</label>
      <select id="subjectSelect">
        <option value="Biology">Biology (الأحياء)</option>
        <option value="Geology">Geology (الجيولوجيا)</option>
        <option value="English">English (الإنجليزي)</option>
        <option value="Mechanics">Mechanics (الميكانيكا)</option>
        <option value="Math">Math (الرياضيات)</option>
      </select>

      <label>اختر الملف للرفع:</label>
      <input type="file" id="fileInput">
      <button onclick="handleUploadFile()">رفع ومشاركة الملف 📂</button>
    </div>

    <!-- تبويبات المواد -->
    <div class="filter-tabs">
      <button class="tab-btn active" onclick="filterBy('All', this)">الكل</button>
      <button class="tab-btn" onclick="filterBy('Biology', this)">Biology</button>
      <button class="tab-btn" onclick="filterBy('Geology', this)">Geology</button>
      <button class="tab-btn" onclick="filterBy('English', this)">English</button>
      <button class="tab-btn" onclick="filterBy('Mechanics', this)">Mechanics</button>
      <button class="tab-btn" onclick="filterBy('Math', this)">Math</button>
    </div>

    <!-- قائمة الملفات -->
    <div id="filesList" style="margin-top: 16px;"></div>
  </div>

  <script>
    const OWNER_EMAIL = "hobazeema900@gmail.com";
    const SERVICE_ID  = "service_nzthyi8";
    const TEMPLATE_ID = "template_rsook3v";
    const PUBLIC_KEY  = "1iW1iRr1jl5aiKV-5";

    emailjs.init(PUBLIC_KEY);

    let authMode = "register";
    let pendingUserData = null;
    let currentUserEmail = "";
    let generatedOTP = null;
    let currentFilter = 'All';

    function switchAuthTab(mode) {
      authMode = mode;
      const tabReg = document.getElementById("tabRegister");
      const tabLog = document.getElementById("tabLogin");
      const btn = document.getElementById("authBtn");
      const sub = document.getElementById("authSubtitle");

      if (mode === 'register') {
        tabReg.classList.add("active");
        tabLog.classList.remove("active");
        btn.innerText = "إنشاء الحساب واستلام كود التأكيد ✉️";
        sub.innerText = "أنشئ حسابك بكلمة مرور واحصل على رمز التحقق";
      } else {
        tabLog.classList.add("active");
        tabReg.classList.remove("active");
        btn.innerText = "دخول واستلام كود التأكيد ✉️";
        sub.innerText = "أدخل بياناتك وسيصلك رمز تأكيد الدخول";
      }
    }

    function handleAuthSubmit(e) {
      e.preventDefault();
      const email = document.getElementById("userEmail").value.trim().toLowerCase();
      const pass = document.getElementById("userPassword").value;
      const btn = document.getElementById("authBtn");

      let users = JSON.parse(localStorage.getItem("stem_users_db") || "{}");

      if (authMode === "register") {
        if (users[email]) {
          alert("هذا البريد مسجل بالفعل! يمكنك الانتقال إلى خيار تسجيل الدخول.");
          return;
        }
      } else {
        if (!users[email]) {
          alert("هذا البريد غير مسجل! قم بإنشاء حساب جديد أولاً.");
          return;
        }
        if (users[email].password !== pass) {
          alert("كلمة المرور غير صحيحة!");
          return;
        }
      }

      pendingUserData = { email, password: pass, mode: authMode };
      generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();

      btn.disabled = true;
      btn.innerText = "جاري إرسال رمز الأمان...";

      emailjs.send(SERVICE_ID, TEMPLATE_ID, {
        to_email: email,
        otp_code: generatedOTP
      })
      .then(() => {
        alert("تم إرسال كود التأكيد بنجاح إلى: " + email);
        document.getElementById("step-auth").classList.add("hidden");
        document.getElementById("step-otp").classList.remove("hidden");
        document.getElementById("otpNotice").innerText = "تم إرسال كود التحقق إلى " + email;
        btn.disabled = false;
        switchAuthTab(authMode);
      })
      .catch((error) => {
        alert("حدث خطأ أثناء الإرسال: " + (error.text || JSON.stringify(error)));
        btn.disabled = false;
        switchAuthTab(authMode);
      });
    }

    function handleVerifyOTP() {
      const entered = document.getElementById("otpInput").value.trim();

      if (entered === generatedOTP) {
        let users = JSON.parse(localStorage.getItem("stem_users_db") || "{}");
        currentUserEmail = pendingUserData.email;

        if (pendingUserData.mode === "register") {
          users[currentUserEmail] = { password: pendingUserData.password };
          localStorage.setItem("stem_users_db", JSON.stringify(users));
          alert("تم تأكيد البريد وإنشاء الحساب بنجاح!");
        } else {
          alert("تم تسجيل الدخول بنجاح!");
        }

        document.getElementById("step-otp").classList.add("hidden");
        document.getElementById("step-dashboard").classList.remove("hidden");
        document.getElementById("userBadge").innerText = currentUserEmail;

        checkOwnerPrivileges();
        renderFiles();
      } else {
        alert("كود التحقق غير صحيح! يرجى إعادة المحاولة.");
      }
    }

    function backToAuth() {
      document.getElementById("step-otp").classList.add("hidden");
      document.getElementById("step-auth").classList.remove("hidden");
      document.getElementById("otpInput").value = "";
    }

    function checkOwnerPrivileges() {
      const isOwner = (currentUserEmail === OWNER_EMAIL.toLowerCase());
      const ownerBadge = document.getElementById("ownerBadgeContainer");
      const ownerSec = document.getElementById("ownerSection");

      if (isOwner) {
        ownerBadge.innerHTML = '<span class="owner-badge">👑 المالك الرئيسي (Owner)</span>';
        ownerSec.classList.remove("hidden");
        updateOwnerStats();
      } else {
        ownerBadge.innerHTML = '';
        ownerSec.classList.add("hidden");
      }
    }

    function updateOwnerStats() {
      const users = JSON.parse(localStorage.getItem("stem_users_db") || "{}");
      const files = JSON.parse(localStorage.getItem("stem_shared_files") || "[]");
      document.getElementById("statTotalUsers").innerText = Object.keys(users).length;
      document.getElementById("statTotalFiles").innerText = files.length;
    }

    function handleUploadFile() {
      const fileInput = document.getElementById("fileInput");
      const subject = document.getElementById("subjectSelect").value;

      if (!fileInput.files.length) {
        alert("يرجى اختيار ملف أولاً.");
        return;
      }

      const file = fileInput.files[0];
      const reader = new FileReader();

      reader.onload = function(e) {
        const newFile = {
          id: Date.now(),
          name: file.name,
          type: file.type || "application/octet-stream",
          size: (file.size / 1024).toFixed(1) + " KB",
          subject: subject,
          date: new Date().toLocaleDateString('ar-EG'),
          uploader: currentUserEmail,
          dataUrl: e.target.result
        };

        try {
          let files = JSON.parse(localStorage.getItem("stem_shared_files") || "[]");
          files.unshift(newFile);
          localStorage.setItem("stem_shared_files", JSON.stringify(files));
          fileInput.value = "";
          alert("تم رفع الملف بنجاح!");
          renderFiles();
          if (currentUserEmail === OWNER_EMAIL.toLowerCase()) updateOwnerStats();
        } catch (err) {
          alert("حجم الملف كبير، جرب ملفاً أصغر.");
        }
      };

      reader.readAsDataURL(file);
    }

    function openFile(id) {
      const files = JSON.parse(localStorage.getItem("stem_shared_files") || "[]");
      const file = files.find(f => f.id === id);
      if (!file) return;

      const win = window.open();
      if (file.type.startsWith("image/") || file.type === "application/pdf") {
        win.document.write(`
          <title>${file.name}</title>
          <body style="margin:0; background:#090d16; display:flex; justify-content:center; align-items:center; min-height:100vh;">
            <iframe src="${file.dataUrl}" style="border:none; width:100vw; height:100vh;"></iframe>
          </body>
        `);
      } else {
        const a = document.createElement("a");
        a.href = file.dataUrl;
        a.download = file.name;
        a.click();
      }
    }

    function deleteFile(id) {
      if (!confirm("هل أنت متأكد من حذف هذا الملف؟")) return;
      let files = JSON.parse(localStorage.getItem("stem_shared_files") || "[]");
      files = files.filter(f => f.id !== id);
      localStorage.setItem("stem_shared_files", JSON.stringify(files));
      renderFiles();
      if (currentUserEmail === OWNER_EMAIL.toLowerCase()) updateOwnerStats();
    }

    function clearAllFiles() {
      if (!confirm("تحذير: هل أنت متأكد من مسح جميع الملفات نهائياً؟")) return;
      localStorage.removeItem("stem_shared_files");
      renderFiles();
      updateOwnerStats();
      alert("تم مسح كافة الملفات.");
    }

    function filterBy(subj, btn) {
      currentFilter = subj;
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderFiles();
    }

    function renderFiles() {
      let files = JSON.parse(localStorage.getItem("stem_shared_files") || "[]");
      const container = document.getElementById("filesList");
      const isOwner = (currentUserEmail === OWNER_EMAIL.toLowerCase());

      if (currentFilter !== 'All') {
        files = files.filter(f => f.subject === currentFilter);
      }

      if (!files.length) {
        container.innerHTML = '<p style="text-align: center; color: var(--text-muted); font-size: 13px; padding: 20px;">لا توجد ملفات في هذا القسم حالياً.</p>';
        return;
      }

      container.innerHTML = files.map(f => {
        const canDelete = isOwner || (f.uploader === currentUserEmail);
        return `
          <div class="file-item">
            <div>
              <strong style="display: block; font-size: 14px;">${f.name}</strong>
              <div class="file-meta">${f.size} • رفع بواسطة: ${f.uploader} • ${f.date}</div>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
              <span class="badge">${f.subject}</span>
              <button class="btn-action btn-view" onclick="openFile(${f.id})">فتح 👁️</button>
              ${canDelete ? `<button class="btn-action btn-delete" onclick="deleteFile(${f.id})">حذف</button>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    function logout() {
      location.reload();
    }
  </script>
</body>
</html>
